services:
  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: postgres
    volumes:
      - hub-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hub-pgdata:
