server {
    listen 80;
    client_max_body_size 50m;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. With the upstream in a variable, nginx resolves "api" per request
    # (cached 10s), so an api container restart with a new address does not leave a stale one.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        # A variable without a URI part passes the request URI through unchanged (/api/...).
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA entry point (also the fallback for client routes) must always be revalidated,
    # or a new build keeps loading the old asset names.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
